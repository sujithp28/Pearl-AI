name: Python

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pearl (with dev dependencies)
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check src/ tests/ benchmarks/

      - name: Format check (ruff format)
        run: ruff format --check src/ tests/ benchmarks/

      # Split so a failure says which layer broke rather than just
      # "tests failed".
      - name: Unit and integration tests
        run: pytest -q --ignore=tests/test_e2e_mcp.py

      # Spawns a real `python -m src.mcp` subprocess and drives it
      # over real stdio. No model server needed: the LLM is replaced
      # by the deterministic `scripted` provider, so everything except
      # the model itself runs for real. See tests/test_e2e_mcp.py.
      - name: End-to-end tests (real subprocess, real stdio)
        run: pytest -q tests/test_e2e_mcp.py

  # The browser UI's pure helpers. Its own job rather than a step in the
  # matrix above: the result does not depend on the Python version, so
  # running it three times would only slow the build down.
  ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No install step and no package.json on purpose. These modules
      # are plain ES modules with no dependencies, run by Node's own
      # test runner. See docs/superpowers/specs for why pearl_ui has no
      # build step.
      - name: UI tests
        run: node --test pearl_ui/js/*.test.js
