name: Python

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pearl (with dev dependencies)
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check src/ tests/ benchmarks/

      - name: Format check (ruff format)
        run: ruff format --check src/ tests/ benchmarks/

      # Split so a failure says which layer broke rather than just
      # "tests failed".
      - name: Unit and integration tests
        run: pytest -q --ignore=tests/test_e2e_mcp.py

      # Spawns a real `python -m src.mcp` subprocess and drives it
      # over real stdio. No model server needed: the LLM is replaced
      # by the deterministic `scripted` provider, so everything except
      # the model itself runs for real. See tests/test_e2e_mcp.py.
      - name: End-to-end tests (real subprocess, real stdio)
        run: pytest -q tests/test_e2e_mcp.py
