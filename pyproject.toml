[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pearl-agent"
version = "1.2.0b0"
description = "Pearl — a self-hostable AI coding agent with autonomous execution, patch-preview approval, and repository intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pearl contributors" }]
keywords = ["ai", "agent", "coding-assistant", "llm", "mcp", "web-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "openai>=1.0",
    "httpx>=0.25",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
claude = ["anthropic>=0.30"]
gemini = ["google-generativeai>=0.5"]
dev = [
    "pytest>=7.0",
    "pyflakes>=3.0",
    "ruff>=0.16",
]
all = ["pearl-agent[claude,gemini,dev]"]

[project.urls]
Homepage = "https://github.com/sujithp28/Pearl-AI"
Repository = "https://github.com/sujithp28/Pearl-AI"

[project.scripts]
pearl = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real-model tests load a multi-GB GGUF and take minutes; they are opt-in.
#   run them with:  pytest -m real_model
#   skip them with: pytest -m "not real_model"   (the default below)
addopts = "-m 'not real_model'"
markers = [
    "real_model: end-to-end test against the real local Qwen model (slow, opt-in)",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
