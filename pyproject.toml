[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pearl-agent"
version = "1.2.0b0"
description = "Pearl — a self-hostable AI coding agent with autonomous execution, patch-preview approval, and repository intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pearl contributors" }]
keywords = ["ai", "agent", "coding-assistant", "llm", "mcp", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.30"]
gemini = ["google-generativeai>=0.5"]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "pyflakes>=3.0",
    "ruff>=0.16",
]
all = ["pearl-agent[claude,gemini,dev]"]

[project.urls]
Homepage = "https://github.com/sujithp28/Pearl-AI"
Repository = "https://github.com/sujithp28/Pearl-AI"

[project.scripts]
pearl = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# No single test should ever take a minute. Matters most for the
# end-to-end tests in `tests/test_e2e_mcp.py`, which read from a real
# subprocess's pipe: without a bound, a server that starts but never
# answers would hang the whole CI job until the runner's own (hours-
# long) limit, instead of failing in a minute with a useful traceback.
timeout = 60

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
