# Pearl — single-instance deployment.
#
# This runs ONE Pearl for ONE trusted party. It is not a multi-tenant
# setup: everyone who reaches this container shares its execution
# environment, so a second user could read the first user's workspace
# and run commands in it. Per-user isolation needs a container per user;
# see docs/DEPLOYMENT.md.
#
#   docker compose up --build
#   open http://localhost:7474

services:
  pearl:
    build: .
    ports:
      # Bound to localhost, not 0.0.0.0: an unauthenticated Pearl on a
      # reachable port is a remote shell. Change this only together with
      # PEARL_AUTH_TOKENS below.
      - "127.0.0.1:7474:7474"

    volumes:
      # The project Pearl works on. Point this at your own repository.
      - ./workspace:/workspace
      # Models persist across rebuilds — otherwise every `up --build`
      # re-downloads ~1.1 GB.
      - pearl-models:/home/pearl/.pearl/models
      # Checkpoints (undo history) must survive restarts to be worth
      # anything.
      - pearl-state:/home/pearl/.pearl/workspaces

    environment:
      PEARL_WORKSPACE: /workspace

      # A container is a poor place for on-device inference: it is slow
      # without a GPU and costs ~1.1 GB of RAM per instance. A hosted
      # Pearl should use a remote model. Uncomment one:
      #
      # PEARL_LLM_PROVIDER: gemini
      # GEMINI_API_KEY: ${GEMINI_API_KEY}
      #
      # PEARL_MODEL_PROFILE: cloud

      # Required before exposing this beyond localhost. Format:
      #   token1:alice,token2:bob
      # PEARL_AUTH_TOKENS: ${PEARL_AUTH_TOKENS}

      # Asserts that a sandbox exists. Do NOT set this for a single
      # shared container — tools run real commands, so it would be a
      # claim that is not true here.
      # PEARL_PUBLIC_MODE: "false"

    # Bounded so a runaway plan cannot take the host down with it.
    deploy:
      resources:
        limits:
          memory: 4G

    restart: unless-stopped

volumes:
  pearl-models:
  pearl-state:
